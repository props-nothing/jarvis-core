name: Release (private artifacts)

# Packages the single jarvis program only after CI passes for its exact commit.
# Main pushes reuse completed CI; manual/tag runs call the same CI workflow first.
# Artifacts are kept 14 days and downloadable by signed-in users of this public repository.
# Every eligible run attaches all five platforms to a draft after the complete package matrix succeeds.
#
# JARVIS is Apache-2.0 licensed. This workflow still creates drafts only: dependency-license inventories,
# signing/notarization and clean-machine verification remain public-release gates (TODO.md, P9-017b).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

# A failed/foreign CI completion must not cancel a valid release; reruns of the same CI run share a group.
concurrency:
  group: release-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Select verified source
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the exact eligible commit
        id: source
        run: node scripts/release-policy.mjs

  quality:
    needs: source
    if: needs.source.outputs.ready == 'true' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [source, quality]
    # Main already passed CI. A skipped quality job is not a bypass for a manual/tag run.
    if: ${{ !cancelled() && needs.source.outputs.ready == 'true' && (needs.quality.result == 'success' || (github.event_name == 'workflow_run' && needs.quality.result == 'skipped')) }}
    permissions:
      contents: read
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: "" }
          - { os: ubuntu-24.04-arm, label: linux-aarch64, target: "" }
          - { os: macos-latest, label: macos-aarch64, target: "" }
          # Built on the Apple-silicon runner for the Intel target, so it is not smoke-tested here.
          - { os: macos-latest, label: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: "" }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Report pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
      - name: Add the cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Cache release dependencies
        # Cache restoration is an optimization; the locked build always runs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.label }}
          cache-on-failure: true
      - name: Build release programs
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" -p jarvis-cli
          else
            cargo build --release --locked -p jarvis-cli
          fi
      - name: Package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            bash scripts/package-release.sh "${{ matrix.label }}" "target/${{ matrix.target }}/release"
          else
            bash scripts/package-release.sh "${{ matrix.label }}"
          fi
      - name: Smoke test the packaged programs
        # The archive is unpacked into an empty folder and the programs are asked for their version, which proves they start and
        # that nothing outside the archive is needed. Skipped for the cross-built Intel macOS archive, which cannot run here.
        if: matrix.target == ''
        shell: bash
        run: |
          rm -rf smoke && mkdir smoke
          # `find`, not `ls dist/*.zip`: a glob that matches nothing makes `ls` exit 2, which `pipefail` turns into a failed step.
          archive="$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          case "$archive" in
            *.zip) (cd smoke && unzip -q "../$archive" || 7z x -bso0 "../$archive") ;;
            *) tar -C smoke -xzf "$archive" ;;
          esac
          dir="$(ls -d smoke/jarvis-*)"
          ext=""; [ -f "$dir/jarvis.exe" ] && ext=".exe"
          "$dir/jarvis$ext" version
          "$dir/jarvis$ext" daemon --version
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarvis-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  draft:
    name: Attach complete draft release
    needs: [source, package]
    # quality is intentionally skipped after successful main CI; require the entire package matrix.
    if: ${{ !cancelled() && needs.source.outputs.ready == 'true' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Download this run's verified packages
        run: |
          gh --version
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'jarvis-*' --dir dist
      - name: Verify checksums and attach to a draft only
        shell: bash
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing exact tested commit"; exit 1; }
          shopt -s nullglob
          archives=(dist/jarvis-*/*.tar.gz dist/jarvis-*/*.zip)
          checksums=(dist/jarvis-*/*.sha256)
          [ "${#archives[@]}" -eq 5 ] && [ "${#checksums[@]}" -eq 5 ] \
            || { echo "::error::Expected all five platform archives and checksums"; exit 1; }
          for label in linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64 windows-x86_64; do
            extension=tar.gz; [ "$label" != windows-x86_64 ] || extension=zip
            platform_archives=(dist/"jarvis-$label"/jarvis-*-"$label.$extension")
            [ "${#platform_archives[@]}" -eq 1 ] && [ -f "${platform_archives[0]}.sha256" ] \
              || { echo "::error::Missing unique archive/checksum for $label"; exit 1; }
          done
          for checksum in "${checksums[@]}"; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done

          tag="ci-$RELEASE_SHA"
          tag_options=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            tag_options=(--verify-tag)
          else
            # Drafts use a pending tag name. Never create/move a Git ref or let an existing tag override --target.
            existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
              --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
            [ -z "$existing_ref" ] || { echo "::error::Automatic draft tag already exists; refusing to reuse it"; exit 1; }
          fi
          if release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish \
              --jq '[.isDraft, .targetCommitish] | @tsv')"; then
            IFS=$'\t' read -r is_draft target <<< "$release"
            [ "$is_draft" = true ] || { echo "::error::Refusing to modify a published release"; exit 1; }
            if [ "${#tag_options[@]}" -eq 0 ] && [ "$target" != "$RELEASE_SHA" ]; then
              echo "::error::Draft target differs from the tested commit"; exit 1
            fi
            gh release upload "$tag" "${archives[@]}" "${checksums[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Upload during creation; a newly created draft may not be immediately discoverable by another CLI lookup.
            gh release create "$tag" "${archives[@]}" "${checksums[@]}" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --target "$RELEASE_SHA" "${tag_options[@]}" \
              --title "JARVIS $tag" \
              --notes "Unsigned build of $RELEASE_SHA. Unpack and run jarvis (one program). See docs/user/quick-start.md. Intel macOS is cross-built; its runtime smoke test is not run. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

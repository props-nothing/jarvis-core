name: CI

on:
  # PRs validate proposed changes; main validates merges. Tags are validated by
  # Release's workflow_call, so a version tag does not run the full suite twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  source-checks:
    name: Formatting and HUD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Set up the HUD build runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check documentation links and ADR identifiers
        run: |
          node --test scripts/test-docs.mjs
          node scripts/check-docs.mjs
      - name: Check live coding gate opt-in guards
        run: node --test scripts/test-coding-website-gate.mjs
      - name: Check the console scripts parse
        # The console is plain JavaScript embedded in the daemon, so a syntax slip would otherwise show only as a blank page.
        shell: bash
        run: |
          set -e
          for script in hud mission head settings; do node --check "apps/jarvisd/src/hud/$script.js"; done
      - name: Test console behavior
        run: node --test scripts/test-hud-console.mjs scripts/test-hud-settings.mjs scripts/test-hud-memory.mjs scripts/test-hud-polling.mjs scripts/test-hud-history.mjs
      - name: Build typed HUD controls and check embedded output
        working-directory: apps/jarvisd/ui
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- ../src/hud/generated

  rust-lint:
    name: Rust lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Lint all targets
        id: lint
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings 2>&1 | tee clippy.txt
      - name: Annotate lint failures
        if: failure() && steps.lint.outcome == 'failure'
        shell: bash
        run: |
          set +e

          [ -f clippy.txt ] || { echo "::error::clippy.txt was not created by the lint step"; exit 0; }

          grep -a -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::diag: $line"
          done
          tail -n 6 clippy.txt | while IFS= read -r line; do
            echo "::error::tail: $line"
          done
          echo "===== diagnostics ====="
          grep -a -E '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.txt | head -n 60 || true
          echo "===== tail 40 ====="
          tail -n 40 clippy.txt || true

          echo "===== diagnostic (full) ====="
          cat clippy.txt
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-${{ matrix.os }}
          path: |
            clippy.txt
            test.txt
            gate-*.txt
            target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  rust-tests:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: all, packages: '--workspace' }
          - { os: macos-latest, suite: all, packages: '--workspace' }
          - { os: windows-latest, suite: storage, packages: '-p jarvis-storage' }
          - { os: windows-latest, suite: daemon, packages: '-p jarvisd' }
          - { os: windows-latest, suite: remaining, packages: '--workspace --exclude jarvis-storage --exclude jarvisd' }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.os }}-${{ matrix.suite }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test release behavior on the native shell
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        run: node --test scripts/test-release-flow.mjs
      - name: Test archive contents and license notices
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        shell: bash
        run: bash scripts/test-package-release.sh
      - name: Build daemon test peer
        # Selecting jarvisd alone does not build another package's fixture binary.
        if: matrix.suite == 'daemon'
        run: cargo build -p jarvis-mcp-transport --features fixture-peer --bin fixture-peer --locked --timings
      - name: Test workspace
        id: tests
        # Leave time for diagnostics/cache saving before the enclosing job limit.
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 50 || 25 }}
        env:
          ACCEPTANCE_REQUIRE_FIXTURE_PEER: "1"
        shell: bash
        run: cargo test ${{ matrix.packages }} --all-features --locked --no-fail-fast --timings 2>&1 | tee test.txt
      - name: Annotate test failures
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          set +e
          [ -f test.txt ] || { echo "::error::test.txt was not created by the test step"; exit 0; }

          grep -a -E '^test .* FAILED|^failures:' test.txt | head -n 8 | while IFS= read -r line; do
            echo "::error::failed: $line"
          done
          grep -a -E '^thread .*panicked at|^assertion.*failed|^[[:space:]]+(left|right):' test.txt | head -n 10 | while IFS= read -r line; do
            echo "::error::panic: $line"
          done
          grep -a -E 'has overflowed its stack|^fatal runtime error:|^[[:space:]]+process didn.t exit successfully:' test.txt | head -n 6 | while IFS= read -r line; do
            echo "::error::crash: $line"
          done
          grep -a -E '^test result: FAILED' test.txt | head -n 4 | while IFS= read -r line; do
            echo "::error::summary: $line"
          done
          grep -a -E '^error(\[|:)' test.txt | head -n 6 | while IFS= read -r line; do
            echo "::error::error: $line"
          done

          echo "===== failures and panics ====="
          grep -a -B2 -A12 -E '^failures:|panicked at|has overflowed its stack|^fatal runtime error:|signal: [0-9]+' test.txt | head -n 120 || true
          echo "===== tail 30 ====="
          tail -n 30 test.txt || true
      - name: Build current acceptance binaries once
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        run: cargo build --workspace --all-features --locked --timings
      - name: Build coding lifecycle agent fixture
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        run: cargo build -p jarvis-runtimes --example fake_acp_agent --locked
      - name: Phase 1 acceptance gate
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
          ACCEPTANCE_REQUIRE_FIXTURE_PEER: "1"
        shell: bash
        run: bash scripts/ci-run-gate.sh phase1_gate
      - name: Phase 2 acceptance gate
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
          ACCEPTANCE_REQUIRE_FIXTURE_PEER: "1"
        shell: bash
        run: bash scripts/ci-run-gate.sh phase2_gate
      - name: Phase 3 acceptance gate
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
          ACCEPTANCE_REQUIRE_FIXTURE_PEER: "1"
        shell: bash
        run: bash scripts/ci-run-gate.sh phase3_gate
      - name: Coding lifecycle acceptance gate
        if: matrix.suite == 'all' || matrix.suite == 'remaining'
        env:
          ACCEPTANCE_REQUIRE_BINARIES: "1"
          ACCEPTANCE_REQUIRE_FIXTURE_PEER: "1"
        shell: bash
        run: bash scripts/ci-run-gate.sh coding_lifecycle
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.suite }}
          path: |
            clippy.txt
            test.txt
            gate-*.txt
            target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check advisories bans licenses sources
          arguments: --all-features

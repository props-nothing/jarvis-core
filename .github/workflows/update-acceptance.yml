name: Update acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact compatible signed ci release tag
        required: true
        type: string
      version:
        description: Exact package version
        required: true
        default: '0.1.0'
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-update:
    name: Signed update and service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_VERSION: ${{ inputs.version }}
      # A distinct local build is the previous executable. The candidate must be
      # downloaded and verified through production signed staging, never injected.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - name: Check out the acceptance implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up the acceptance runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install the pinned compiler
        run: rustup toolchain install
      - name: Prove clean-host drivers reject this developer image
        run: node --test scripts/test-clean-lifecycle.mjs
      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: update-acceptance-${{ matrix.os }}
          cache-on-failure: true
      - name: Build the previous executable
        run: cargo build --locked -p jarvis-cli
      - name: Prepare the hosted Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          systemctl --version
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify native signed update, service readiness, rollback and recovery
        shell: bash
        run: |
          binary=target/debug/jarvis
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          node scripts/test-update-lifecycle.mjs "$binary" "$RELEASE_TAG" "$PACKAGE_VERSION" --native-service 2>&1 | tee update-acceptance.txt
      - name: Retain bounded acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-acceptance-${{ matrix.os }}
          path: update-acceptance.txt
          if-no-files-found: ignore
          retention-days: 14

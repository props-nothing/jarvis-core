[workspace]
members = [
    "apps/jarvis-cli",
    "apps/jarvisd",
    "crates/jarvis-application",
    "crates/jarvis-connectors",
    "crates/jarvis-core",
    "crates/jarvis-diagnostics",
    "crates/jarvis-documents",
    "crates/jarvis-mcp",
    "crates/jarvis-mcp-transport",
    "crates/jarvis-models",
    "crates/jarvis-observability",
    "crates/jarvis-protocol",
    "crates/jarvis-runtimes",
    "crates/jarvis-sandbox",
    "crates/jarvis-storage",
    "crates/jarvis-tools",
    "crates/jarvis-update",
    "crates/jarvis-voice",
    "crates/jarvis-web",
    "tests/e2e",
]
resolver = "3"
exclude = ["vendor/docx-rs-0.4.22", "vendor/rust_xlsxwriter-0.99.1"]

# The published Office writers require yanked ZIP 8. These audited copies change
# only that manifest dependency to ZIP 9; remove once upstream publishes it.
# See vendor/README.md and docs/research/integrations/github-actions-rust-ci.md.
[patch.crates-io]
docx-rs = { path = "vendor/docx-rs-0.4.22" }
rust_xlsxwriter = { path = "vendor/rust_xlsxwriter-0.99.1" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
jarvis-update = { path = "crates/jarvis-update", version = "0.1.0" }
serde_yaml_ng = "=0.10.0"
atomic-write-file = "0.3.1"
async-trait = "0.1.92"
# Pinned exactly. axum's `main` branch is mid-0.9 and documented as breaking, so a
# floating requirement could resolve to a version with a different `serve` signature and
# `Router` fallback semantics. Features are explicit because the defaults also enable
# `form`, `query`, `matched-path`, `original-uri`, and `tower-log`, none of which this API
# needs. See docs/research/integrations/rust-http-server-and-sse.md.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
bytes = "1.12.0"
# Capability-based filesystem access, for the read-only filesystem tool (`P3-006`).
#
# The workspace forbids `unsafe_code`, so a hand-written `openat`/`NtCreateFile` wrapper is not an
# option: confinement has to come from a crate that already exposes a safe handle-based API.
# `cap-std` is that crate -- it wraps `rustix` (and `openat2` with `RESOLVE_BENEATH`) on unix and a
# safe `windows-sys` wrapper on Windows, and it does not expose `unsafe` itself.
#
# It replaces the obvious "canonicalize the joined path, then prefix-check it" scheme, which has a
# TOCTOU window: the path is resolved and then opened, so a component swapped for a symlink in between
# escapes. A `Dir` resolves each component beneath its own handle, so an escape cannot be expressed as
# a path at all. See docs/research/integrations/cap-std-filesystem-confinement.md.
cap-std = "4.0.3"
etcetera = "0.11.0"
# Text out of documents people send (PDF, Word, spreadsheets), for `jarvis.files.read_document` (`ADR-0158`). Pure parsers, in their own crate so the
# dependencies stay out of the domain crates. `lopdf` with its default `rayon`/`chrono` features off; `zip` with only the deflate backend that
# `flate2` already provides.
lopdf = { version = "0.45.0", default-features = false }
roxmltree = "0.21.1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Owned host-process lifetimes; all three already occur in the locked MCP graph.
# Safe wrappers preserve unsafe_code = forbid. See process-lifetime.md.
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags"] }
nix = { version = "=0.31.3", default-features = false }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
getrandom = "0.4.3"
# The MCP binding layer (`P3-009c-a`) is a `tower` service over `http` types, so the daemon can mount the SDK's
# service without this crate naming it. Declared in the workspace table rather than with a version in one crate,
# because `cargo deny`'s `workspace-duplicate` check refuses a crate that has both: a duplicate declaration is
# how two crates end up on different minor lines of the same package with nothing reporting it.
http = { version = "1.5", default-features = false }
http-body = "1.0"
http-body-util = "0.1.5"
jarvis-application = { path = "crates/jarvis-application", version = "0.1.0" }
jarvis-connectors = { path = "crates/jarvis-connectors", version = "0.1.0" }
jarvis-core = { path = "crates/jarvis-core", version = "0.1.0" }
jarvis-diagnostics = { path = "crates/jarvis-diagnostics", version = "0.1.0" }
jarvis-documents = { path = "crates/jarvis-documents", version = "0.1.0" }
jarvis-mcp = { path = "crates/jarvis-mcp", version = "0.1.0" }
jarvis-mcp-transport = { path = "crates/jarvis-mcp-transport", version = "0.1.0" }
jarvis-models = { path = "crates/jarvis-models", version = "0.1.0" }
jarvis-observability = { path = "crates/jarvis-observability", version = "0.1.0" }
jarvis-protocol = { path = "crates/jarvis-protocol", version = "0.1.0" }
jarvis-runtimes = { path = "crates/jarvis-runtimes", version = "0.1.0" }
jarvis-sandbox = { path = "crates/jarvis-sandbox", version = "0.1.0" }
jarvis-storage = { path = "crates/jarvis-storage", version = "0.1.0" }
jarvis-tools = { path = "crates/jarvis-tools", version = "0.1.0" }
jarvis-voice = { path = "crates/jarvis-voice", version = "0.1.0" }
jarvis-web = { path = "crates/jarvis-web", version = "0.1.0" }
# Pinned exactly, and with NO features enabled. The default feature set is
# `resolve-http` + `resolve-file` + a TLS provider + `idna`, which makes a `$ref` a
# network fetch. A tool schema is authored by JARVIS or a connector manifest, so a
# reference must resolve within the document set JARVIS supplies -- fetching a URL
# inside the tool path is the SSRF surface `docs/architecture/security.md` lists.
# Disabling the defaults also removes `reqwest`, `rustls`, and `idna` from this graph.
# See docs/research/integrations/json-schema-validation.md.
jsonschema = { version = "=0.57.0", default-features = false }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "json", "multipart", "rustls", "stream"] }
# The official MCP Rust SDK, selected in `docs/research/integrations/mcp.md` (P3-007) and adopted
# here (P3-008e). Apache-2.0.
#
# Pinned exactly, like `axum` and `jsonschema`, because the protocol revision this SDK targets is a
# *source* fact rather than a compatibility range: `3.4.0` is the release whose `ProtocolVersion`
# carries `V_2026_07_28`, and the SDK's own `LATEST` constant is NOT that revision. A floating
# requirement could resolve to a release that changes which revisions are known, which would change
# what "modern" means without any local code changing.
#
# Feature set is deliberately the narrowest that serves the client side of `P3-008`:
#   - `client`     -- the `Peer` request surface (`list_tools`, `call_tool`) this adapter needs.
#   - `transport-child-process` -- stdio via a spawned child, the standard local MCP shape.
#   - `transport-streamable-http-client-reqwest` -- the current HTTP transport, on the `reqwest`
#     already in this graph rather than a second HTTP stack.
# `server`, `transport-io` and `transport-streamable-http-server` were added for the
# opt-in JARVIS MCP server in `P3-009`. `auth` remains OFF: JARVIS owns the named
# credentials and pre-registered OAuth lifecycle in its adapters. `macros` remains
# OFF because the server binds canonical tool contracts without generated routers.
# See docs/research/integrations/mcp.md for the measured evidence behind this set.
rmcp = { version = "=3.4.0", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The canonical intent hash of an approval decision. Already in the locked graph as a
# `sqlx` transitive dependency, so declaring it adds no new package. Used with no
# features: the default set is `std` plus `asm`, and this project needs neither the
# assembly optimizations nor `oid`, `zeroize`, or `sha2-asm`.
# See docs/research/integrations/sha2-intent-hashing.md.
sha2 = { version = "=0.10.9", default-features = false }
# `postgres` is enabled for `P4-009`: the server-backed backend needs the driver, and it now has a
# **measured requirement** rather than a planned one, because the memory-embedding repository and its
# tests run against a real pgvector server (the probes recorded in
# docs/research/integrations/postgres-pgvector.md were run against `pgvector/pgvector:pg17`, extension
# 0.8.6). `sqlx-postgres` was already in the lock file, so nothing new is *pinned* — the feature only
# compiles what was already resolved. Note `tls-*` stays off: a server mode that talks TLS is
# `docs/product/requirements.md`'s multi-device story, which no record covers yet, so a plaintext
# loopback connection is the only one this slice can justify.
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled", "postgres"] }
thiserror = "2.0.20"
# Writing spreadsheets and Word files (`P11-010`, `docs/research/integrations/office-writers.md`). Both are pinned; neither is built with its optional extras.
# Decoding the pictures an MCP tool returns (P11-011).
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
rust_xlsxwriter = { version = "=0.99.1", default-features = false }
docx-rs = { version = "=0.4.22", default-features = false }
# Wall-clock schedules (`P6-003`, `docs/research/integrations/jiff-time-zones.md`). The whole zone database is
# bundled so a schedule means the same on every platform and never depends on a system file.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
time =  { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
toml = "1.1.6"
tracing = { version = "=0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std"] }
uuid = { version = "1.26.1", features = ["v7"] }

# A shipped build is small and fast: thin link-time optimisation, one codegen unit, and symbols stripped. Panics still
# unwind (not `abort`), so a panic in one task does not take the whole daemon down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

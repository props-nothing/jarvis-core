[package]
name = "jarvis-storage"
description = "Storage adapters and migration infrastructure for JARVIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Explicit test fixture API; ordinary production builds do not enable it.
test-support = ["dep:tokio"]

[dependencies]
atomic-write-file.workspace = true
etcetera.workspace = true
jarvis-core.workspace = true
libsqlite3-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
jarvis-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "io-util", "rt-multi-thread"] }

[lints]
workspace = true
